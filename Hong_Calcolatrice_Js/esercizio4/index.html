<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice</title>
</head>

<body>
    <h2>Calcolatrice basic</h2>
    <br>
    <div class="numeri">
        <label for="op_1">Fattore 1</label>
        <input type="text" id="op_1" placeholder="Inserisci primo operando">

        <label for="op_2">Fattore 2</label>
        <input type="text" id="op_2" placeholder="Inserisci secondo operando">

        <label for="ris">Risultato:</label>
        <input type="text" id="ris" placeholder="Risultato" readonly>
    </div>
    
    <br><br>

    <div class="bottoni">
        <button id="piu" class="pulsanti">+</button>
        <button id="sott" class="pulsanti">-</button>
        <br><br>
        <button id="per" class="pulsanti">*</button>
        <button id="div" class="pulsanti">/</button>
        <br><br>
        <button id="canc" class="pulsanti">cancel</button>
    </div>


    <script src="main.js"></script>
</body>
</html>
