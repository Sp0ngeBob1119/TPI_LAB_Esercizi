<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Titolo = Articoli</h1>
    <ul id="bodyTest">

    </ul>
</body>

<script>
    fetch('https://jsonplaceholder.typicode.com/posts').then(
        function(posts){
        var p = posts.json()
        return p
    }
).then(
        function(risposta){
        console.log(risposta)
        var testo= document.getElementById("bodyTest")
        for(i = 0; i < risposta.length ; i++){
            var element = document.createElement("li")
            element.innerHTML = risposta[i].title + " - "+risposta[i].body
            testo.appendChild(element)
        }
        
    })
</script>
</html>
